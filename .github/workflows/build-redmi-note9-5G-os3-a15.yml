name: Build Redmi Note 9 (Dual-Boot AOSP & HyperOS)

on:
  workflow_dispatch:
  workflow_call:

env:
  # ============ 设备信息 ============
  DEVICE_NAME: "redmi_note9"
  DEVICE_CODENAME: "cannon"

  # ============ 补充 build-process / pack-process 需要的变量 ============
  KERNEL_ARCH: "arm64"
  CURLX: "curl -L"
  UPLOADNAME: "cannon_a16"
  HAVE_NO_DTBO: "true"
  HAVE_NO_DTBO_TOOL: "true"

  # ============ 编译工具链 ============
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE: "https://github.com/你的内核源码仓库.git"
  KERNEL_BRANCH: "你的分支名"

  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/x86/x86_64-linux-android-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_NAME: "cannon_defconfig"
  DEFCONFIG_FROM_BOOT: false

  # ============ KernelSU Next ============
  KERNELSU_SOURCE: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
  KERNELSU_BRANCH: "next"
  KERNELSU_METHOD: "shell"
  KERNELSU_AUTO_GET: "false"

  # ============ SUSFS ============
  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  # ============ 打包 ============
  PACK_METHOD: "Anykernel3"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  ROM_TEXT: "aosp_a16"

  # ============ 补丁集 ============
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "redmi_note_9_aosp_a16_414"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  # ============ 功能开关 ============
  REKERNEL_ENABLE: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HOOK_METHOD: "syscall"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  HIDE_STUFF: "true"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

jobs:
  build-kernel:
    name: Build Kernel for ${{ env.DEVICE_NAME }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: Clone fuck-bpf
        run: git clone https://github.com/techyminati/fuck-bpf.git $GITHUB_WORKSPACE/fuck-bpf

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🧬 Integrate KernelSU Next
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          curl -LSs "${{ env.KERNELSU_SOURCE }}" | bash -s legacy

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      - name: 🧬 Patch Kernel for BPF (Android 16)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          if [ -f "$GITHUB_WORKSPACE/fuck-bpf/apply.sh" ]; then
            cd $GITHUB_WORKSPACE/fuck-bpf
            ./apply.sh --mb || true
            cd $GITHUB_WORKSPACE/device_kernel
          fi
          pip3 install --upgrade git+https://github.com/R0rt1z2/mtk-bpf-patcher
          if [ -f "./out/arch/arm64/boot/Image" ]; then
            mtk-bpf-patcher ./out/arch/arm64/boot/Image ./out/arch/arm64/boot/Image.patched
            mv ./out/arch/arm64/boot/Image.patched ./out/arch/arm64/boot/Image
          fi

      - name: 🧰 Patch Kernel of Re:Kernel
        if: env.REKERNEL_ENABLE == 'true'
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        if: env.BASEBAND_GUARD_ENABLE == 'true'
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        if: env.HIDE_STUFF == 'true'
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-cannon
          path: |
            device_kernel/*.zip
            device_kernel/out/arch/arm64/boot/Image
            device_kernel/out/arch/arm64/boot/Image.gz-dtb
            device_kernel/out/arch/arm64/boot/dtb.img
            device_kernel/out/arch/arm64/boot/dtbo.img